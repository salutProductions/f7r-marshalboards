name: "Publish Portable Windows EXE"

on:
  push:
    tags:
      - "v*" # Triggers when you push a version tag like v1.0.0

jobs:
  publish-windows-portable:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install # Change to yarn install or pnpm install if needed

      # This runs the build but avoids the heavy installer-bundling phase
      - name: Build Tauri Raw Binary
        run: npm run tauri build -- --no-bundle

      # Creates the GitHub Release and automatically uploads the standalone .exe
      - name: Create Release and Upload Portable EXE
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ github.ref_name }}"
          body: ""
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/*.exe
