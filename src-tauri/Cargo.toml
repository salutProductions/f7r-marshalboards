[package]
name = "f7r-marshalboards"
version = "0.4.0"
description = "A compact LMU marshal board overlay for F7R race control."
authors = ["salutProductions"]
edition = "2021"

[lib]
name = "f7r_marshalboards_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opener = "0.8.5"
